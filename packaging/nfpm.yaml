# nfpm (https://nfpm.goreleaser.com) config for the .deb, .rpm, .apk and Arch packages,
# built by .github/workflows/packages.yml from a release tarball, not from source.
#
# Environment:
#   WHYTIME_VERSION  version without the leading v, e.g. 0.1.1
#   WHYTIME_ARCH     amd64 or arm64 (nfpm maps them to each format's name)
#   WHYTIME_SRC      the extracted whytime-vX.Y.Z-ARCH-linux-musl directory, with its man
#                    pages gzipped (gzip -9n man/*.1)
#
# Local build with the nfpm version pinned in packages.yml, e.g. the Debian package:
#   WHYTIME_VERSION=0.1.1 WHYTIME_ARCH=amd64 WHYTIME_SRC=whytime-v0.1.1-x86_64-linux-musl \
#     nfpm pkg -f packaging/nfpm.yaml -p deb -t whytime_0.1.1_amd64.deb
#
# No install scripts: granting cap_bpf,cap_perfmon would let every local user trace the
# whole system, so that stays an explicit opt-in (README, Privileges).
name: whytime
version: ${WHYTIME_VERSION}
version_schema: semver
arch: ${WHYTIME_ARCH}
platform: linux
maintainer: Aaron Esau <git@aaronesau.com>
vendor: Aaron Esau
homepage: https://github.com/Arinerron/whytime
license: MIT
section: devel
priority: optional
# One line: apk and Arch metadata cannot hold a multi-line description.
description: >-
  Explains where a command's wall-clock time went: off-CPU and on-CPU attribution
  across its process tree, from eBPF

rpm:
  group: Development/Tools
  summary: Explains where a command's wall-clock time went
  packager: Aaron Esau <git@aaronesau.com>

archlinux:
  packager: Aaron Esau <git@aaronesau.com>

# Debian's zsh searches vendor-completions and keeps licenses in /usr/share/doc/whytime
# (copyright); the other formats use site-functions and /usr/share/licenses/whytime.
contents:
  - {src: "${WHYTIME_SRC}/whytime", dst: /usr/bin/whytime, expand: true, file_info: {mode: 0755}}
  - {src: "${WHYTIME_SRC}/man/*.1.gz", dst: /usr/share/man/man1/, expand: true, file_info: {mode: 0644}}
  - {src: "${WHYTIME_SRC}/completions/whytime.bash", dst: /usr/share/bash-completion/completions/whytime, expand: true, file_info: {mode: 0644}}
  - {src: "${WHYTIME_SRC}/completions/whytime.fish", dst: /usr/share/fish/vendor_completions.d/whytime.fish, expand: true, file_info: {mode: 0644}}

  - {src: "${WHYTIME_SRC}/completions/_whytime", dst: /usr/share/zsh/vendor-completions/_whytime, packager: deb, expand: true, file_info: {mode: 0644}}
  - {src: "${WHYTIME_SRC}/LICENSE", dst: /usr/share/doc/whytime/copyright, packager: deb, expand: true, file_info: {mode: 0644}}
  - {src: "${WHYTIME_SRC}/THIRD_PARTY_LICENSES.md", dst: /usr/share/doc/whytime/THIRD_PARTY_LICENSES.md, packager: deb, expand: true, file_info: {mode: 0644}}

  - &zsh {src: "${WHYTIME_SRC}/completions/_whytime", dst: /usr/share/zsh/site-functions/_whytime, packager: rpm, expand: true, file_info: {mode: 0644}}
  - &license {src: "${WHYTIME_SRC}/LICENSE", dst: /usr/share/licenses/whytime/LICENSE, type: license, packager: rpm, expand: true, file_info: {mode: 0644}}
  - &notices {src: "${WHYTIME_SRC}/THIRD_PARTY_LICENSES.md", dst: /usr/share/licenses/whytime/THIRD_PARTY_LICENSES.md, type: license, packager: rpm, expand: true, file_info: {mode: 0644}}
  - {<<: *zsh, packager: apk}
  - {<<: *license, type: file, packager: apk}
  - {<<: *notices, type: file, packager: apk}
  - {<<: *zsh, packager: archlinux}
  - {<<: *license, type: file, packager: archlinux}
  - {<<: *notices, type: file, packager: archlinux}
