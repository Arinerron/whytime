[package]
name = "whytime"
description = "Explains where a command's wall-clock time went: off-CPU and on-CPU attribution across its process tree, from eBPF"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["ebpf", "profiler", "performance", "off-cpu", "linux"]
categories = ["development-tools::profiling", "command-line-utilities", "os::linux-apis"]

# `cargo binstall whytime`: the static musl release tarball, for glibc hosts as well.
[package.metadata.binstall]
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/whytime-v{ version }-x86_64-linux-musl.tar.gz"
bin-dir = "whytime-v{ version }-x86_64-linux-musl/{ bin }"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/whytime-v{ version }-x86_64-linux-musl.tar.gz"
bin-dir = "whytime-v{ version }-x86_64-linux-musl/{ bin }"

[package.metadata.binstall.overrides.aarch64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/whytime-v{ version }-aarch64-linux-musl.tar.gz"
bin-dir = "whytime-v{ version }-aarch64-linux-musl/{ bin }"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/whytime-v{ version }-aarch64-linux-musl.tar.gz"
bin-dir = "whytime-v{ version }-aarch64-linux-musl/{ bin }"

[dependencies]
whytime-abi = { workspace = true, features = ["user"] }
whytime-bpf.workspace = true
wire.workspace = true
procctx.workspace = true
bpfdoctor.workspace = true
aya.workspace = true
anyhow.workspace = true
clap.workspace = true
clap_complete.workspace = true
libc.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
object.workspace = true
rustc-demangle.workspace = true
cpp_demangle.workspace = true

[dev-dependencies]
# `FixtureEnv` for the doctor check tests.
bpfdoctor = { workspace = true, features = ["testing"] }

[lints]
workspace = true
