[package]
name = "whytime-abi"
description = "Kernel/user ABI of whytime: ring buffer records, the per-task map value and shared constants"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["ebpf", "bpf", "whytime"]
categories = ["os::linux-apis", "development-tools::profiling"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
# `header()` (linked from the crate docs) is behind `std`.
features = ["std"]

[features]
# C header generation for the BPF build script.
std = ["wire/std"]
# `aya::Pod` impls so the loader can use the records as map keys and values.
user = ["dep:aya"]

[dependencies]
wire.workspace = true
aya = { workspace = true, optional = true }

[lints]
workspace = true
