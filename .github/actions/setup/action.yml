name: whytime build setup
description: >
  Installs clang for the BPF object and the toolchain and targets from rust-toolchain.toml.
  Expects whytime checked out at $GITHUB_WORKSPACE with submodules (tracekit).
runs:
  using: composite
  steps:
    - name: Check the tracekit submodule
      shell: bash
      run: |
        test -f tracekit/crates/wire/Cargo.toml || {
          echo "::error::tracekit submodule missing: check out with submodules: recursive"
          exit 1
        }
    - name: Install clang
      shell: bash
      run: |
        sudo apt-get update -q
        sudo apt-get install -yq --no-install-recommends clang llvm
    - name: Install the Rust toolchain from rust-toolchain.toml
      shell: bash
      run: |
        rustup toolchain install
        rustc --version
    - name: Cache cargo registry and target
      uses: Swatinem/rust-cache@v2
