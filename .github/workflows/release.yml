name: release

# A `v*` tag builds static x86_64 and aarch64 binaries and publishes them, with shell
# completions, man pages and the third-party license notices, as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/setup

      - name: Build static binaries
        run: |
          cargo build --release -p whytime --target x86_64-unknown-linux-musl
          cargo build --release -p whytime --target aarch64-unknown-linux-musl

      - name: Package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          host=target/x86_64-unknown-linux-musl/release/whytime
          mkdir -p dist/share/completions
          "$host" completions bash > dist/share/completions/whytime.bash
          "$host" completions zsh > dist/share/completions/_whytime
          "$host" completions fish > dist/share/completions/whytime.fish
          "$host" completions elvish > dist/share/completions/whytime.elv
          "$host" completions powershell > dist/share/completions/_whytime.ps1
          cargo xtask man dist/share/man
          cargo xtask licenses dist/share/THIRD_PARTY_LICENSES.md
          for arch in x86_64 aarch64; do
            name="whytime-$TAG-$arch-linux-musl"
            mkdir -p "dist/$name"
            cp "target/$arch-unknown-linux-musl/release/whytime" LICENSE README.md \
              dist/share/THIRD_PARTY_LICENSES.md "dist/$name/"
            cp -r dist/share/completions dist/share/man "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
            (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          done
          file target/*-unknown-linux-musl/release/whytime

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          generate_release_notes: true
