name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: x86_64 build and unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: whytime
      - uses: ./whytime/.github/actions/setup
      - name: Build (static, x86_64 musl)
        working-directory: whytime
        run: |
          cargo build --release -p whytime
          file target/x86_64-unknown-linux-musl/release/whytime | grep -Eq 'static-pie linked|statically linked'
      - name: Unit tests
        working-directory: whytime
        run: cargo test --workspace
      - name: Completions and man pages
        working-directory: whytime
        run: |
          for shell in bash zsh fish elvish powershell; do
            target/x86_64-unknown-linux-musl/release/whytime completions "$shell" > /dev/null
          done
          cargo xtask man target/man
          test -s target/man/whytime.1

  aarch64:
    name: aarch64 check, build and qemu smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: whytime
      - uses: ./whytime/.github/actions/setup
      - name: Install qemu-user
        run: sudo apt-get install -yq --no-install-recommends qemu-user
      - name: Check
        working-directory: whytime
        run: cargo check --target aarch64-unknown-linux-musl --workspace
      - name: Build (static, aarch64 musl, rust-lld)
        working-directory: whytime
        run: |
          cargo build --release -p whytime --target aarch64-unknown-linux-musl
          bin=target/aarch64-unknown-linux-musl/release/whytime
          file "$bin" | grep -Eq 'ARM aarch64.*(static-pie linked|statically linked)'
          qemu-aarch64 "$bin" --version
          qemu-aarch64 "$bin" completions bash > /dev/null

  e2e:
    name: end-to-end suite (virtme-ng VM)
    runs-on: ubuntu-24.04
    env:
      # Ubuntu mainline build (BTF enabled) booted by virtme-ng; whytime needs >= 5.18.
      KERNEL: v6.12.40
    steps:
      - uses: actions/checkout@v4
        with:
          path: whytime
      - uses: ./whytime/.github/actions/setup
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install virtme-ng
        run: |
          sudo apt-get install -yq --no-install-recommends qemu-system-x86 virtiofsd busybox-static
          pipx install virtme-ng
      - name: Build on the host (the VM has no network)
        working-directory: whytime
        run: |
          cargo build --release -p whytime -p whytime-testbins
          cargo build -p xtask
      - name: cargo xtask test-e2e in the VM
        working-directory: whytime
        run: |
          # The guest starts in this directory and sees the host's root filesystem read-only
          # (writes under /home and /etc go to a RAM overlay); it runs the suite as the runner
          # user, whose passwordless sudo works in the guest too. Scratch files go on an ext4
          # disk image (the guest's only virtio disk, /dev/vda): the suite refuses tmpfs and
          # needs file capabilities (setcap). Keep the script short: vng passes it on the
          # kernel command line, and an over-long one hangs the guest silently.
          truncate -s 1G "$RUNNER_TEMP/e2e.img"
          mkfs.ext4 -q "$RUNNER_TEMP/e2e.img"
          # shellcheck disable=SC2016 # expanded in the guest
          vng --run "$KERNEL" --disable-microvm --user "$USER" --memory 4G --cpus 4 \
            --disk "$RUNNER_TEMP/e2e.img" \
            --exec 'set -e; export PATH="$HOME/.cargo/bin:$PATH" WHYTIME_E2E_DIR=/tmp/e2e; uname -r;
                    sudo mkdir -p /tmp/e2e; sudo mount /dev/vda /tmp/e2e;
                    sudo chown $(id -u):$(id -g) /tmp/e2e; cargo xtask test-e2e' < /dev/null
