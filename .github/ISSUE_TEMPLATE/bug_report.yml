name: Bug report
description: whytime crashed, refused to run, or attributed time wrongly.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Security vulnerabilities must not be
        reported here: follow [SECURITY.md](https://github.com/Arinerron/whytime/blob/main/SECURITY.md)
        instead.

        Reports, `whytime doctor` output and trace files can contain command lines, paths and
        hostnames. Redact anything you do not want to make public.
  - type: textarea
    id: command
    attributes:
      label: What you ran
      description: The exact whytime command line, and what the traced command does if it is not obvious.
      placeholder: sudo whytime -- make -j8
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected whytime to do or report, and why.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead, including the human-readable report or any error message.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: whytime version
      description: Output of `whytime --version`.
      placeholder: whytime 0.1.1
    validations:
      required: true
  - type: input
    id: kernel
    attributes:
      label: Kernel
      description: Output of `uname -r`.
      placeholder: 6.12.40-061240-generic
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Distribution
      description: Distribution and version, and whether it runs in a VM or container.
      placeholder: Ubuntu 24.04, bare metal
    validations:
      required: true
  - type: dropdown
    id: privileges
    attributes:
      label: How whytime got its privileges
      options:
        - sudo
        - file capabilities (setcap)
        - root shell
        - none (whytime report or doctor only)
        - other (describe below)
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: whytime doctor output
      description: The full output of `whytime doctor`, run the same way (sudo, setcap or root) as the failing command.
      render: text
    validations:
      required: true
  - type: textarea
    id: json
    attributes:
      label: JSON report
      description: The report from the same run with `--json` added (or `whytime report FILE --json` for a trace file). Leave empty if whytime did not get as far as reporting.
      render: json
  - type: textarea
    id: trace
    attributes:
      label: Trace file
      description: |
        Optional but very helpful: rerun with `--record bug.wt`, compress the file and drag it
        here. `whytime report bug.wt` reproduces the report offline. Review it for sensitive
        data first (see SECURITY.md).
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Other context, such as whether it happens every time, or with `WHYTIME_LOG=debug` output.
