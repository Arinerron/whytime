[workspace]
resolver = "3"
members = [
    "crates/whytime-abi",
    "crates/whytime-bpf",
    "crates/whytime",
    "crates/whytime-testbins",
    "xtask",
]
# The tracekit submodule is a workspace of its own; its crates are path dependencies here.
exclude = ["tracekit"]
default-members = ["crates/whytime"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/Arinerron/whytime"
homepage = "https://github.com/Arinerron/whytime"

[workspace.dependencies]
# The three published crates move in lockstep: bump these `=` pins with `version` above.
whytime-abi = { version = "=0.1.1", path = "crates/whytime-abi" }
whytime-bpf = { version = "=0.1.1", path = "crates/whytime-bpf" }

# Published on crates.io; the submodule paths are used for local builds.
wire = { version = "0.1.0", path = "tracekit/crates/wire", package = "tracekit-wire" }
procctx = { version = "0.1.0", path = "tracekit/crates/procctx" }
bpfdoctor = { version = "0.1.0", path = "tracekit/crates/bpfdoctor" }

aya = { version = "0.14.0", default-features = false }
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
clap_mangen = "0.3"
libc = "0.2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Flamegraphs: ELF symbol tables of mapped files, symbol demangling (the SVG is drawn by
# `svg.rs`, no dependency).
object = { version = "0.39", default-features = false, features = ["read_core", "elf", "std"] }
rustc-demangle = "0.1"
cpp_demangle = "0.5"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

# e2e workloads (`cargo xtask test-e2e`): symbols kept so flamegraph checks find their
# functions; xtask adds frame pointers through RUSTFLAGS in a separate target directory.
[profile.e2e]
inherits = "release"
strip = "none"
